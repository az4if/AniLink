# fly.toml app configuration file generated for anilink on 2026-11-26T18:12:02Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'anilink'
primary_region = 'sin'

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 2
  memory_mb = 512
  processes = ['app']
  size = 'shared-cpu-2x'
