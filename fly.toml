app = "anilink"
primary_region = "iad"

[http_service]
auto_start_machines = true
auto_stop_machines = true
force_https = true
internal_port = 3_000
min_machines_running = 0
processes = [ "app" ]

[[vm]]
cpu_kind = "shared"
cpus = 1
memory = "256mb"

[[vm]]
cpu_kind = "shared"
cpus = 2
memory = "512mb"
memory_mb = 512
processes = [ "app" ]
size = "shared-cpu-2x"
