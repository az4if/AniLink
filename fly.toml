# fly.toml app configuration file generated for anilink on 2026-11-26T17:35:08Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'anilink'
primary_region = 'iad'

[build]
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'true'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
